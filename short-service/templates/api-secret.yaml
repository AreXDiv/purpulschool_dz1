apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.name }}-secret
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-clusterip:%d/%s" 
  .Values.database.user 
  .Values.database.password 
  .Values.postgres.name 
  ( .Values.postgres.port | int64 )
  .Values.database.db| b64enc | quote }}
 

# postgresql://user:password@url:port/database - Вид строки подключения
# url - можно взять из сервиса, так как обращение к сервису по его умени возвращает путь до контейнера
# postgresql://demo:demo@postges-dbclusterip:5432/demo