apiVersion: v1
kind: Pod
metadata:
  name: conv-app
  labels:
    component: image-conv
spec:
  containers:
    - name: conv-app
      image: antonlarichev/conv-app:1.2
      ports:
        - containerPort: 80
      resources:
        limits:
          memory: "512Mi"   # ← увеличено
          cpu: "500m"
        requests:
          memory: "256Mi"   # ← можно чуть меньше лимита
          cpu: "200m"